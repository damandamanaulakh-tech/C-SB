name: Relink validate and regenerate Sourceborn indexes

on:
  workflow_dispatch:
  push:
    paths:
      - 'registries/**'
      - 'machine/**'
      - 'raw/**'
      - 'tools/**'
      - 'phase2/**'
      - 'docs/**'
      - 'CANONICALITY.json'
      - 'README.md'

permissions:
  contents: write

jobs:
  validate-and-generate:
    if: ${{ !contains(github.event.head_commit.message || '', '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble canonical long sources
        run: python tools/assemble_sources.py
      - name: Build machine-readable registry views
        run: python tools/generate_registry_views.py
      - name: Build AI native candidate review registry
        run: python tools/build_ai_candidate_registry.py
      - name: Build V2 rubric and ASI-node cross-reference views
        run: python tools/generate_rubric_views.py
      - name: Build source-supported sub-parameter split candidates
        run: python tools/build_subparameter_candidates.py
      - name: Relink all known IDs and generate indexes
        run: python tools/relink_and_index.py
      - name: Validate AI and ASI container extraction
        run: python tools/validate_ai_asi_container_candidates.py
      - name: Validate locked invariants
        run: python tools/validate_repo.py
      - name: Commit regenerated indexes and assembled docs
        shell: bash
        run: |
          git config user.name "sourceborn-index-bot"
          git config user.email "sourceborn-index-bot@users.noreply.github.com"
          git add generated
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "[generated] rebuild Sourceborn indexes and assembled sources"
            git push
          fi
