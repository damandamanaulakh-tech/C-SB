name: Relink validate and regenerate Sourceborn indexes

on:
  workflow_dispatch:
  push:
    paths:
      - 'registries/**'
      - 'machine/**'
      - 'raw/**'
      - 'tools/**'
      - 'phase2/**'
      - 'docs/**'
      - 'CANONICALITY.json'
      - 'README.md'

permissions:
  contents: write

jobs:
  validate-and-generate:
    if: ${{ !contains(github.event.head_commit.message || '', '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble canonical long sources
        run: python tools/assemble_sources.py
      - name: Build machine-readable registry views
        run: python tools/generate_registry_views.py
      - name: Materialize and verify Human native 2560 custody
        run: python tools/materialize_human_native_2560_v1.py
      - name: Validate exact Human 2560 runtime depth placement
        run: python tools/validate_human_native_2560_runtime_depth_v1.py
      - name: Build AI native candidate review registry
        run: python tools/build_ai_candidate_registry.py
      - name: Build V2 rubric and ASI-node cross-reference views
        run: python tools/generate_rubric_views.py
      - name: Build source-supported sub-parameter split candidates
        run: python tools/build_subparameter_candidates.py
      - name: Build approved Brain Engine operational sub-parameters
        run: python tools/generate_operational_subparameters_v1.py
      - name: Build AI ASI multi-owner operational parameter bindings
        run: python tools/generate_ai_asi_operational_parameter_bindings_v1.py
      - name: Build exact Brain Engine source relationships
        run: python tools/generate_brain_engine_relationships_v1.py
      - name: Bind approved AI-only records through AI-CAP lineage
        run: python tools/generate_ai_only_bindings_v1.py
      - name: Build AI-NEW 64 structural decomposition
        run: python tools/generate_ai_new_64_structural_decomposition_v1.py
      - name: Build AI runtime and ASI governance interface views
        run: python tools/generate_ai_asi_native_runtime_views_v1.py
      - name: Bind bounded Engines to ASI Nodes from source container use
        run: python tools/generate_engine_asi_node_bindings_v1.py
      - name: Relink all known IDs and generate indexes
        run: python tools/relink_and_index.py
      - name: Validate sentence micro-sequence pattern learning runtime
        run: python tools/validate_micro_sequence_pattern_runtime_v1.py
      - name: Validate semantic clarification residual-return fixture
        run: python tools/validate_semantic_clarification_residual_return_001.py
      - name: Test live sentence micro-sequence interpreter
        run: python tools/test_micro_sequence_live_interpreter_v1.py
      - name: Validate AI and ASI container extraction
        run: python tools/validate_ai_asi_container_candidates.py
      - name: Validate approved expansion 081 to 160
        run: python tools/validate_expansion_081_160_v1.py
      - name: Validate expansion P2561 to P2592 domain ownership
        run: python tools/validate_expansion_2561_2592_domain_bindings_v1.py
      - name: Validate Brain Engine source adoption
        run: python tools/validate_brain_engine_adoption_v1.py
      - name: Validate AI ASI multi-owner operational parameters
        run: python tools/validate_ai_asi_operational_parameter_bindings_v1.py
      - name: Run AI-NEW 64 structural R-F-R
        run: python tools/run_phase2_ai_new_64_structural_rfr_v1.py
      - name: Run AI-NEW 64 orphan overlap attack
        run: python tools/run_phase2_ai_new_64_orphan_overlap_attack_v1.py
      - name: Build AI-NEW 64 narrowed runtime routes V2
        run: python tools/generate_ai_new_64_runtime_routes_v2.py
      - name: Run AI-NEW 64 breadth-repair R-F-R V2
        run: python tools/run_phase2_ai_new_64_breadth_repair_rfr_v2.py
      - name: Run AI ASI structural R-F-R tests
        run: python tools/run_phase2_ai_asi_rfr_v1.py
      - name: Build compact R-F-R findings view
        run: python tools/summarize_phase2_ai_asi_rfr_v1.py
      - name: Run authorization and Engine-repair behavioral R-F-R tests
        run: python tools/run_phase2_behavioral_rfr_v1.py
      - name: Run Wisdom source-ingestion R-F-R batch 001
        run: python tools/run_phase2_wisdom_batch_001_rfr.py
      - name: Run Human AI Wisdom ASI integration R-F-R 001
        run: python tools/run_phase2_multi_rubric_integration_001.py
      - name: Run Actor View leakage R-F-R 001
        run: python tools/run_phase2_actor_view_leakage_001.py
      - name: Run closure scope inheritance R-F-R 001
        run: python tools/run_phase2_closure_scope_inheritance_001.py
      - name: Run Human Wisdom no-AI R-F-R 001
        run: python tools/run_phase2_human_wisdom_no_ai_001.py
      - name: Validate locked invariants
        run: python tools/validate_repo.py
      - name: Commit regenerated indexes and assembled docs
        shell: bash
        run: |
          git config user.name "sourceborn-index-bot"
          git config user.email "sourceborn-index-bot@users.noreply.github.com"
          git add generated
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "[generated] rebuild Sourceborn indexes and assembled sources"
            git push
          fi
